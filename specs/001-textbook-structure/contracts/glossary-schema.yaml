# Glossary Entry Schema
# Validates glossary term entries

$schema: http://json-schema.org/draft-07/schema#
title: Glossary Entry
description: Schema for technical term definitions in glossary
type: object

required:
  - term
  - definition
  - category

properties:
  term:
    type: string
    description: Technical term (unique across glossary)
    minLength: 2
    maxLength: 50
    examples:
      - "SLAM"
      - "Inverse Kinematics"
      - "Sim-to-Real Transfer"

  definition:
    type: string
    description: Concise explanation (50-150 words)
    minLength: 50
    maxLength: 800
    examples:
      - "The process of deploying a policy or algorithm trained in simulation to a physical robot..."

  context:
    type: string
    description: Where/why this term is used
    minLength: 20
    maxLength: 300
    examples:
      - "Critical technique in Physical AI to accelerate training without expensive real-world data collection"

  relatedTerms:
    type: array
    description: Cross-references to other glossary terms
    items:
      type: string
    default: []
    examples:
      - ["Domain Randomization", "Reality Gap", "Reinforcement Learning"]

  chapterReferences:
    type: array
    description: Chapters where this term appears
    items:
      type: string
      pattern: ^(week-[0-9]{2}|front-matter-.+|capstone|appendix-.+)$
    default: []
    examples:
      - ["week-11", "week-12", "week-13"]

  category:
    type: string
    description: Term category for organization
    enum:
      - "robotics"
      - "ai-ml"
      - "control"
      - "hardware"
      - "simulation"
      - "deployment"
      - "perception"
      - "planning"
    examples: ["simulation", "robotics", "ai-ml"]

  acronym:
    type: string
    description: Acronym if applicable
    pattern: ^[A-Z0-9]+$
    examples: ["SLAM", "ROS", "VLA"]

  externalLinks:
    type: array
    description: Links to external resources
    items:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
    examples:
      - title: "SLAM Wikipedia"
        url: "https://en.wikipedia.org/wiki/Simultaneous_localization_and_mapping"

additionalProperties: false
